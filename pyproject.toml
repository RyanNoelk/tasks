[project]
name = "daily-tasks"
version = "0.1.0"
description = "Self-hosted daily recurring checklist."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "jinja2==3.1.4",
    "python-multipart==0.0.20",
    "python-dateutil==2.9.0.post0",
]

[tool.setuptools]
packages = ["app"]
