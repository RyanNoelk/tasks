services:
  tasks:
    build: .
    image: daily-tasks:latest
    container_name: daily-tasks
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TZ: ${TZ:-UTC}
      DB_PATH: /data/tasks.db
      PORT: "8000"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./data:/data
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
