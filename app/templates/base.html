<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Daily Tasks{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="topnav">
        <a class="brand" href="/">Daily Tasks</a>
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-burger" aria-label="Toggle menu">&#9776;</label>
        <div class="nav-links">
            <span class="nav-group">Daily Tasks</span>
            <a href="/manage">Manage</a>
            <a href="/history">History</a>
            <span class="nav-sep" aria-hidden="true"></span>
            <span class="nav-group">One-off Tasks</span>
            <a href="/one-offs/history">Completed</a>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
    // Set browser timezone cookie so server can compute "today" in user's local zone.
    // First visit only: detect tz, set cookie, reload once.
    (function () {
        try {
            const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
            if (!tz) return;
            const cookies = document.cookie.split(';').map(s => s.trim());
            const current = cookies.find(c => c.startsWith('tz='));
            const decoded = current ? decodeURIComponent(current.slice(3)) : null;
            if (decoded !== tz) {
                document.cookie = 'tz=' + encodeURIComponent(tz) +
                    '; path=/; max-age=31536000; samesite=lax';
                if (!current) location.reload();
            }
        } catch (e) {}
    })();

    function tasksToggleScheduleFields(form) {
        const select = form.querySelector('[name="preset"]');
        if (!select) return;
        const preset = select.value;
        form.querySelectorAll('[data-preset-show]').forEach(el => {
            const presets = el.getAttribute('data-preset-show').split(',');
            el.style.display = presets.includes(preset) ? '' : 'none';
        });
    }
    function tasksInitForms(root) {
        (root || document).querySelectorAll('form.template-form').forEach(tasksToggleScheduleFields);
    }
    function tasksFormatTimes(root) {
        (root || document).querySelectorAll('time[data-fmt]').forEach(el => {
            const iso = el.getAttribute('datetime');
            if (!iso) return;
            const d = new Date(iso);
            if (isNaN(d.getTime())) return;
            const fmt = el.getAttribute('data-fmt');
            let text = '';
            if (fmt === 'time') {
                text = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
            } else if (fmt === 'date') {
                text = d.toLocaleDateString([], { month: 'short', day: 'numeric' });
            } else if (fmt === 'datetime') {
                text = d.toLocaleString([], {
                    month: 'short', day: 'numeric',
                    hour: 'numeric', minute: '2-digit'
                });
            }
            if (text) el.textContent = text;
        });
    }
    document.addEventListener('change', e => {
        if (e.target.matches('[name="preset"]')) {
            const form = e.target.closest('form');
            if (form) tasksToggleScheduleFields(form);
        }
    });
    document.addEventListener('DOMContentLoaded', () => {
        tasksInitForms();
        tasksFormatTimes();
    });
    document.body.addEventListener('htmx:afterSwap', e => {
        tasksInitForms(e.detail.target);
        tasksFormatTimes(e.detail.target);
    });
    </script>
</body>
</html>
