<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Daily Tasks{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="topnav">
        <a class="brand" href="/">Daily Tasks</a>
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-burger" aria-label="Toggle menu">&#9776;</label>
        <div class="nav-links">
            <span class="nav-group">Daily Tasks</span>
            <a href="/manage">Manage</a>
            <a href="/history">History</a>
            <span class="nav-sep" aria-hidden="true"></span>
            <span class="nav-group">One-off Tasks</span>
            <a href="/one-offs/history">Completed</a>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
