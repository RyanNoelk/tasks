{# Args: page (OneOffPage), base_path (str), q (str) #}
{% if page.total > page.page_size %}
<nav class="pager" aria-label="Pagination">
    {% if page.has_prev %}
    <a class="pager-btn" href="{{ base_path }}?q={{ q | urlencode }}&page={{ page.page - 1 }}">&larr; Prev</a>
    {% else %}
    <span class="pager-btn disabled">&larr; Prev</span>
    {% endif %}
    <span class="pager-status">Page {{ page.page }} of {{ page.total_pages }} &middot; {{ page.total }} total</span>
    {% if page.has_next %}
    <a class="pager-btn" href="{{ base_path }}?q={{ q | urlencode }}&page={{ page.page + 1 }}">Next &rarr;</a>
    {% else %}
    <span class="pager-btn disabled">Next &rarr;</span>
    {% endif %}
</nav>
{% endif %}
